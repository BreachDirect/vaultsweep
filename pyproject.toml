[project]
name = "vaultsweep"
version = "0.1.0"
description = "Stellar-aware secrets scanner for repos and CI"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
vaultsweep = "vaultsweep.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vaultsweep*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
